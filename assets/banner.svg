    <text x="600" y="253" font-size="132" fill="#7d0f19" textLength="820" lengthAdjust="spacingAndGlyphs">TONGARI BERRY</text>
    <text x="600" y="245" font-size="132" fill="#a31520" textLength="820" lengthAdjust="spacingAndGlyphs">TONGARI BERRY</text>
    <text x="600" y="237" font-size="132" fill="#fff" textLength="820" lengthAdjust="spacingAndGlyphs">TONGARI BERRY</text>
    <text x="600" y="288" font-size="26" font-weight="500" fill="#fff">Un bocado a la vez, un poquito de suerte.</text>
    <rect x="360" y="317" width="480" height="46" rx="23" fill="#3b231c" fill-opacity=".28"/>
    <rect x="360" y="311" width="480" height="46" rx="23" fill="#f5c043"/>
    <text x="600" y="341" font-size="18" fill="#3b231c" textLength="420" lengthAdjust="spacing">★ ESTRELLA DE LA SUERTE ADENTRO ★</text>
