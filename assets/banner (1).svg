<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 404" width="1200" height="404" role="img" aria-label="Tongari Berry - Puesto de helado de fresa" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8202f"/>
      <stop offset="1" stop-color="#a2121d"/>
    </linearGradient>
    <pattern id="top" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="16" fill="#c8202f"/>
    </pattern>
    <pattern id="bot" x="0" y="388" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="0" r="16" fill="#a2121d"/>
    </pattern>
    <symbol id="cone" viewBox="0 0 80 120">
      <path d="M14 62 66 62 40 116Z" fill="#4a2a1f" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M26 74 48 70M30 86 44 82M34 98 42 95" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M14 62Q8 50 24 46Q16 36 30 32Q28 20 40 8Q52 20 50 32Q64 36 56 46Q72 50 66 62Z" fill="#e8899f" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="berry" viewBox="0 0 100 110">
      <path d="M50 102C20 92 6 62 13 42c6-15 27-12 37-8 10-4 31-7 37 8 7 20-7 50-37 60z" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-width="5"/>
      <path d="M50 36 36 14l12 9 2-17 4 17 12-9z" fill="#6d8a5c" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#fff" fill-opacity=".65"><ellipse cx="32" cy="52" rx="3" ry="4.5"/><ellipse cx="50" cy="48" rx="3" ry="4.5"/><ellipse cx="68" cy="52" rx="3" ry="4.5"/><ellipse cx="40" cy="70" rx="3" ry="4.5"/><ellipse cx="60" cy="70" rx="3" ry="4.5"/><ellipse cx="50" cy="88" rx="3" ry="4.5"/></g>
    </symbol>
    <symbol id="star" viewBox="0 0 100 100">
      <path d="M50 6l13 29 31 3-23 21 7 31-28-16-28 16 7-31L6 38l31-3z" fill="#f5c043" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- carpa: borde festoneado arriba y abajo (igual que el footer) -->
  <rect y="0" width="1200" height="32" fill="url(#top)"/>
  <rect y="16" width="1200" height="372" fill="url(#bg)"/>
  <rect y="388" width="1200" height="16" fill="url(#bot)"/>

  <!-- decoracion -->
  <use href="#cone" x="70" y="125" width="110" height="165" transform="rotate(-14 125 207)"/>
  <use href="#cone" x="1020" y="115" width="110" height="165" transform="rotate(14 1075 197)"/>
  <use href="#berry" x="215" y="50" width="56" height="62" transform="rotate(-12 243 81)"/>
  <use href="#berry" x="930" y="52" width="56" height="62" transform="rotate(14 958 83)"/>
  <use href="#berry" x="200" y="300" width="58" height="64" transform="rotate(10 229 332)"/>
  <use href="#berry" x="955" y="296" width="62" height="68" transform="rotate(-10 986 330)"/>
  <use href="#star" x="105" y="58" width="32" height="32"/>
  <use href="#star" x="1075" y="62" width="34" height="34"/>
  <use href="#star" x="585" y="46" width="30" height="30"/>
  <use href="#star" x="300" y="326" width="32" height="32"/>
  <use href="#star" x="868" y="326" width="30" height="30"/>

  <!-- texto -->
  <g font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="600" y="112" font-size="18" fill="#fff" fill-opacity=".88" textLength="640" lengthAdjust="spacing">PUESTO DE HELADO DE FRESA ★ DESDE 2026</text>
    <text x="600" y="249" font-size="132" fill="#7d0f19" textLength="820" lengthAdjust="spacingAndGlyphs">TONGARI BERRY</text>
    <text x="600" y="243" font-size="132" fill="#a31520" textLength="820" lengthAdjust="spacingAndGlyphs">TONGARI BERRY</text>
    <text x="600" y="237" font-size="132" fill="#fff" textLength="820" lengthAdjust="spacingAndGlyphs">TONGARI BERRY</text>
    <text x="600" y="288" font-size="26" font-weight="500" fill="#fff" fill-opacity=".92">Un bocado a la vez, un poquito de suerte.</text>
    <rect x="360" y="322" width="480" height="44" rx="22" fill="#3b231c" fill-opacity=".28"/>
    <rect x="360" y="316" width="480" height="44" rx="22" fill="#f5c043"/>
    <text x="600" y="344" font-size="17" fill="#3b231c" textLength="420" lengthAdjust="spacing">★ ESTRELLA DE LA SUERTE ADENTRO ★</text>
  </g>
</svg>
